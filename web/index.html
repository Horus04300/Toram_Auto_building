<!DOCTYPE html>
<html lang="ko" data-runtime="web">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="application-version" content="{{APP_VERSION}}">
    <meta name="account-server" content="">
    <title>TORAM {{APP_VERSION}}</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/update.css">
    <link rel="stylesheet" href="assets/css/account.css">
    <link rel="stylesheet" href="assets/css/inventory.css">
    <link rel="stylesheet" href="assets/css/platform.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <link rel="stylesheet" href="assets/css/board.css">
    <link rel="stylesheet" href="assets/css/catalog.css">
</head>
<body class="has-platform-shell">
    <div class="platform-shell">
        <a class="platform-skip" href="#platformContent">본문으로 이동</a>
        <aside class="platform-sidebar" aria-label="전체 탐색"><a class="platform-brand" href="./" aria-label="토람 홈">T</a><nav aria-label="주요 메뉴"></nav><span class="platform-sidebar-caption">TORAM</span></aside>
        <div class="platform-workspace">
    <header class="app-titlebar">
        <h1><strong>TORAM <small class="platform-version">{{APP_VERSION}}</small></strong><span class="platform-breadcrumb">홈</span></h1>
        <div class="app-titlebar-actions">
            <button type="button" id="appAccountButton" class="app-build-storage-button" aria-label="계정 열기" aria-haspopup="dialog" title="계정"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></button>
        </div>
    </header>
            <div id="platformContent" tabindex="-1">
                <p class="platform-loading" role="status"><span>TORAM을 불러오는 중입니다.</span> <a href="">새로고침</a></p>
                <main id="homeWorkspace" hidden><header class="home-heading"><h2>홈</h2><p>빌드를 발견하고, 나만의 구성을 완성하세요.</p></header>
    <div class="home-dashboard">
      <section class="home-panel home-ranking" aria-labelledby="hotBuildsTitle"><header class="home-panel-heading"><h3 id="hotBuildsTitle">현재 핫한 빌드</h3><span>즐겨찾기 순</span></header>
        <div class="home-rank-columns" aria-hidden="true"><span>순위</span><span>빌드</span><span>즐겨찾기</span></div>
        <div class="home-ranking-content"><div class="home-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17l-6-4Z"/></svg><strong>아직 공개된 빌드가 없습니다</strong><p>공개 빌드가 등록되면 이곳에서 확인할 수 있어요.</p></div></div><nav class="home-rank-pagination" aria-label="인기 빌드 페이지" hidden><button type="button" data-rank="previous">이전</button><span></span><button type="button" data-rank="next">다음</button></nav>
      </section>
      <div class="home-side">
        <section class="home-panel home-account" aria-labelledby="homeAccountTitle"><header class="home-panel-heading"><h3 id="homeAccountTitle">내 계정</h3></header>
          <div class="home-account-main"><span class="home-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><div><strong class="home-account-name">로그인하고 구성을 보관하세요</strong><p class="home-account-description">내 인벤토리와 저장한 빌드를 한곳에서.</p></div></div>
          <button type="button" class="home-primary home-login">Google 로그인</button><button type="button" class="home-primary home-inventory" hidden>내 인벤토리 열기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button><button type="button" class="home-account-manage" hidden>계정 관리</button><p class="home-account-status" role="status" aria-live="polite"></p>
        </section>
        <section class="home-panel home-recent" aria-labelledby="recentMenusTitle"><header class="home-panel-heading"><h3 id="recentMenusTitle">최근 사용한 메뉴</h3></header><div class="home-recent-content"></div></section>
      </div>
    </div></main>
            </div>
        </div>
    </div>
    <script type="module" src="assets/js/app-entry.mjs"></script>
</body>
</html>
